name: autobuild

# 多版本线构建：由 FPP/build.json 决定构建哪些线，CI 不再写死 1.16.5。
#   - PR / 手动触发：每条线各出一个 artifact（alpha 包）
#   - push tag（v*）：矩阵构建全绿后，从同一个 tag 重新构建并发布 Release
#
# 新增版本线只需改 FPP/build.json + 加 FPP/overlays/<line>/，CI 会自动跟上。

on:
  pull_request:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      line:
        description: "只构建某条版本线（如 mc1.21；留空 = 全部）"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  plan:
    name: 规划版本线矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: 生成构建矩阵
        id: matrix
        run: |
          LINE="${{ github.event.inputs.line }}"
          if [ -n "$LINE" ]; then
            python3 tools/build.py --line "$LINE" --github-output >> "$GITHUB_OUTPUT"
          else
            python3 tools/build.py --github-output >> "$GITHUB_OUTPUT"
          fi

      - name: 展示全部版本线
        run: python3 tools/build.py --list

      - name: 提醒 pack_format 未知的版本线
        run: |
          UNKNOWN="$(python3 tools/build.py --unknown-lines)"
          if [ -n "$UNKNOWN" ]; then
            echo "::warning::以下版本线因 pack_format 未知被跳过，不会出现在本次构建中：$UNKNOWN"
          fi

  build:
    name: 构建 ${{ matrix.artifact }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: 组装并打包
        run: python3 tools/build.py --pack "${{ matrix.pack }}" --line "${{ matrix.line }}" --zip

      - name: 上传 artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.zip }}
          if-no-files-found: error

  release:
    # 只在推 tag 时发布；先等矩阵构建全绿，再从同一个 tag 重新构建并上传。
    # 这里不用 download-artifact：产物由同一脚本从 tag 提交生成，来源可追溯，
    # 也少一个只在发版时才被验证的动作依赖。
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 从 tag 提交构建全部分发包
        run: python3 tools/build.py --all --zip

      - name: 列出产物
        run: ls -lh dist/*.zip

      - name: 创建 / 更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="$GITHUB_REF_NAME"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "FPP $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/*.zip --clobber
